<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maram Sioud — Terminal</title>
<style>
  :root {
    --bg: #0b0d1a;
    --panel: rgba(255,255,255,0.03);
    --fg: #d6def5;
    --dim: #7b84a6;
    --accent: #7aa2ff;
    --accent2: #c39bff;
  }
  [data-theme="cyan"]   { --bg:#061418; --fg:#cdeff5; --dim:#5f8c96; --accent:#22d3ee; --accent2:#67e8f9; }
  [data-theme="violet"] { --bg:#120a1f; --fg:#e7dcff; --dim:#8a7ba8; --accent:#a78bfa; --accent2:#f0abfc; }
  [data-theme="aurora"] { --bg:#071a14; --fg:#d3f5e6; --dim:#6b9a86; --accent:#34d399; --accent2:#a3e635; }
  [data-theme="ember"]  { --bg:#1a0c08; --fg:#fde7d6; --dim:#a07a66; --accent:#fb923c; --accent2:#fbbf24; }
  [data-theme="nebula"] { --bg:#0b0d1a; --fg:#d6def5; --dim:#7b84a6; --accent:#7aa2ff; --accent2:#c39bff; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; transition: background .3s; }
  #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  body.nobg #stars { display: none; }
  .wrap { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 28px 18px 40px; min-height: 100%; display: flex; flex-direction: column; gap: 18px; }

  header { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .avatar { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--bg); font-weight: 700; font-size: 28px; }
  h1 { margin: 0; font-size: 1.6rem; }
  .title { color: var(--accent); margin-top: 4px; }
  .tags { color: var(--dim); font-size: .9rem; margin-top: 4px; }

  nav { display: flex; gap: 8px; flex-wrap: wrap; }
  nav button, .theme-btn, .bg-btn {
    background: var(--panel); color: var(--fg); border: 1px solid var(--dim); border-radius: 6px;
    padding: 6px 12px; font: inherit; cursor: pointer; }
  nav button:hover, .theme-btn:hover, .bg-btn:hover { border-color: var(--accent); color: var(--accent); }
  a { color: var(--accent); }

  .contact-line { color: var(--dim); font-size: .9rem; }

  .terminal { background: var(--panel); border: 1px solid var(--dim); border-radius: 10px; overflow: hidden; flex: 1; display: flex; flex-direction: column; }
  .bar { padding: 8px 12px; border-bottom: 1px solid var(--dim); display: flex; gap: 6px; align-items: center; color: var(--dim); font-size: .8rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); opacity: .6; }
  .screen { padding: 14px; overflow-y: auto; max-height: 60vh; min-height: 320px; flex: 1; }
  .line { white-space: pre-wrap; margin: 0 0 6px; line-height: 1.5; }
  .muted { color: var(--dim); }
  .hl { color: var(--accent); }
  .cmd { color: var(--accent2); }
  .row { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--dim); }
  .prompt { color: var(--accent); }
  input { flex: 1; background: transparent; border: 0; outline: none; color: var(--fg); font: inherit; font-size: 1rem; }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--dim); font-size: .85rem; }
  footer { color: var(--dim); font-size: .8rem; }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="wrap">
  <header>
    <div class="avatar">MS</div>
    <div>
      <h1>Maram Sioud</h1>
      <div class="title">Computer Systems Engineering student · IoT &amp; Embedded Systems</div>
      <div class="tags">Embedded · IoT · Web · Data</div>
    </div>
  </header>

  <nav>
    <button data-cmd="about">about</button>
    <button data-cmd="projects">projects</button>
    <button data-cmd="experience">experience</button>
    <button data-cmd="skills">skills</button>
    <button data-cmd="contact">contact</button>
    <button data-cmd="open cv">Resume</button>
  </nav>

  <div class="contact-line">
    maram.sioud1@gmail.com · +216 21 823 841 · Hammam Sousse, Tunisia · Available Feb – May 2027
  </div>

  <div class="terminal">
    <div class="bar">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span style="margin-left:8px">maram@portfolio: ~</span>
    </div>
    <div class="screen" id="screen"></div>
    <div class="row">
      <span class="prompt">$</span>
      <input id="input" autocomplete="off" spellcheck="false" placeholder="type help">
    </div>
  </div>

  <div class="controls">
    <span>theme:</span>
    <button class="theme-btn" data-theme-name="nebula">Nebula</button>
    <button class="theme-btn" data-theme-name="cyan">Cyan</button>
    <button class="theme-btn" data-theme-name="violet">Violet</button>
    <button class="theme-btn" data-theme-name="aurora">Aurora</button>
    <button class="theme-btn" data-theme-name="ember">Ember</button>
    <button class="bg-btn" id="bgToggle">BG: On</button>
  </div>

  <footer>Tip: ↑/↓ history · Tab autocomplete · type help to see commands</footer>
</div>

<script>
// ---------- DATA (edit these) ----------
const DATA = {
  name: "Maram Sioud",
  email: "maram.sioud1@gmail.com",
  phone: "+216 21 823 841",
  linkedin: "https://www.linkedin.com/in/maram-sioud-472329387/",
  github: "https://github.com/maramsioud",
  cv: "CV.pdf",
  about: [
    "Computer Systems Engineering student at ISITCOM (Hammam Sousse, Tunisia).",
    "Interested in IoT and embedded systems. I like building complete projects that",
    "combine hardware and software: RFID access control, soil monitoring on Arduino,",
    "and web applications.",
    "Available from February to the end of May 2027."
  ],
  projects: {
    rfid: {
      title: "Smart RFID Lock System",
      meta: "Arduino · C++ · Python · Laravel · MySQL · August 2026",
      lines: [
        "End-to-end IoT access control platform.",
        "• Arduino microcontroller (C++) with RC522 RFID reader, servo-driven lock and LCD status display.",
        "• Python serial gateway between the board and a Laravel web dashboard.",
        "• Laravel back-office: card registration, roles & access, real-time analytics, activity logs."
      ]
    },
    soil: {
      title: "Soil Moisture Monitoring System",
      meta: "Arduino · Sensors · C++ · April 2026",
      lines: [
        "Soil moisture measurement with real-time data display.",
        "• Microcontroller programmed in C++, sensors integrated.",
        "• Hands-on IoT and embedded programming."
      ]
    },
    adoption: {
      title: "Animal Adoption Website",
      meta: "HTML · CSS · JavaScript · PHP · March 2026",
      lines: [
        "Web platform connecting animals with adopters.",
        "• Ergonomic interface designed in Figma.",
        "• Database-backed listings and adoption requests."
      ]
    }
  },
  experience: [
    { role: "Engineering / IT Intern", where: "LEONI (Sousse)", when: "June – August 2026",
      lines: [
        "• Two-month internship in an automotive industrial environment.",
        "• Built an end-to-end RFID access control system.",
        "• Developed a Laravel stock management app with a web dashboard."
      ] }
  ],
  education: [
    { title: "Bachelor's Degree in Computer Systems Engineering",
      where: "ISITCOM — Hammam Sousse, Tunisia",
      when: "September 2024 – Present",
      lines: ["Focus: Embedded Systems & IoT"] }
  ],
  skills: [
    ["Embedded & IoT", "C/C++ (Arduino), RFID RC522, servo motor, LCD, serial communication"],
    ["Programming", "Python, Java, JavaScript"],
    ["Web & Data", "Laravel, PHP, HTML/CSS, SQL/MySQL, MongoDB, data analysis, AI"],
    ["Tools", "VS Code, Figma"]
  ],
  certs: [
    "NVIDIA Deep Learning Certification, NVIDIA — Nov 2026",
    "Networking Academy Learn-A-Thon 2025, Cisco — Jan 2026",
    "Introduction to AI & Generative AI, Udacity — Mar 2026",
    "Image Processing with Python, DataCamp — Dec 2025"
  ],
  hackathons: [
    "AKT26 Hackathon – Al-Khawarizmi Tour 2026, AI Track (Nov 2026): took part as part of a team.",
    "CYBERBENDERS AI Challenge — 16-hour cybersecurity hackathon (Nov 2024): CTF challenges, penetration testing, network analysis."
  ],
  languages: ["Arabic (Native)", "French (Fluent)", "English (Fluent)"]
};

// ---------- THEMES ----------
const THEMES = ["nebula", "cyan", "violet", "aurora", "ember"];

// ---------- TERMINAL ----------
const screen = document.getElementById("screen");
const input = document.getElementById("input");
const history = [];
let histIdx = -1;

function out(text, cls = "") {
  const d = document.createElement("div");
  d.className = "line " + cls;
  d.textContent = text;
  screen.appendChild(d);
  screen.scrollTop = screen.scrollHeight;
}
function outHTML(html) {
  const d = document.createElement("div");
  d.className = "line";
  d.innerHTML = html;
  screen.appendChild(d);
  screen.scrollTop = screen.scrollHeight;
}
function blank() { out(""); }

function welcome() {
  out("Welcome to Maram's terminal — type help to see commands.", "hl");
  out("Try: projects, project rfid, open cv, theme aurora");
  blank();
}

const commands = {
  help() {
    out("Available commands:", "hl");
    [
      ["about", "who I am"],
      ["projects", "list projects"],
      ["project <name>", "details (rfid, soil, adoption)"],
      ["experience", "work experience"],
      ["education", "education"],
      ["skills", "technical skills"],
      ["hackathons", "competitions"],
      ["certs", "certifications & courses"],
      ["languages", "languages spoken"],
      ["contact", "email, phone, links"],
      ["open <cv|linkedin|github>", "open a link in a new tab"],
      ["theme <name>", "nebula | cyan | violet | aurora | ember"],
      ["bg <on|off>", "toggle the starfield background"],
      ["clear", "clear the screen"]
    ].forEach(([c, d]) => outHTML(`<span class="cmd">${c.padEnd(26, " ")}</span><span class="muted">${d}</span>`));
  },
  about() { DATA.about.forEach(l => out(l)); },
  projects() {
    out("Projects:", "hl");
    Object.entries(DATA.projects).forEach(([k, p]) =>
      outHTML(`  <span class="cmd">${k.padEnd(10, " ")}</span>${p.title} <span class="muted">— ${p.meta.split(" · ").slice(-1)[0]}</span>`));
    blank();
    out("Type: project <name>", "muted");
  },
  project(args) {
    const key = (args[0] || "").toLowerCase();
    const p = DATA.projects[key];
    if (!p) return out(`No project "${args[0] || ""}". Try: projects`, "muted");
    out(p.title, "hl");
    out(p.meta, "muted");
    p.lines.forEach(l => out(l));
  },
  experience() {
    DATA.experience.forEach(e => {
      out(`${e.role} — ${e.where}`, "hl");
      out(e.when, "muted");
      e.lines.forEach(l => out(l));
      blank();
    });
  },
  education() {
    DATA.education.forEach(e => {
      out(e.title, "hl");
      out(e.where, "muted");
      out(e.when, "muted");
      e.lines.forEach(l => out(l));
    });
  },
  skills() {
    out("Skills:", "hl");
    DATA.skills.forEach(([k, v]) => outHTML(`<span class="cmd">${k}:</span> ${v}`));
  },
  hackathons() { out("Hackathons:", "hl"); DATA.hackathons.forEach(l => out("• " + l)); },
  certs() { out("Certifications & courses:", "hl"); DATA.certs.forEach(l => out("• " + l)); },
  languages() { out("Languages:", "hl"); DATA.languages.forEach(l => out("• " + l)); },
  contact() {
    out("Contact:", "hl");
    outHTML(`email    <a href="mailto:${DATA.email}">${DATA.email}</a>`);
    out("phone    " + DATA.phone);
    outHTML(`linkedin <a href="${DATA.linkedin}" target="_blank" rel="noopener">${DATA.linkedin}</a>`);
    outHTML(`github   <a href="${DATA.github}" target="_blank" rel="noopener">${DATA.github}</a>`);
  },
  open(args) {
    const t = (args[0] || "").toLowerCase();
    const map = { cv: DATA.cv, resume: DATA.cv, linkedin: DATA.linkedin, github: DATA.github };
    if (map[t]) { window.open(map[t], "_blank", "noopener"); return out(`Opening ${t}…`, "muted"); }
    if (DATA.projects[t]) return commands.project([t]);
    out("Usage: open <cv|linkedin|github>", "muted");
  },
  theme(args) {
    const t = (args[0] || "").toLowerCase();
    if (!THEMES.includes(t)) return out("Usage: theme <nebula|cyan|violet|aurora|ember>", "muted");
    document.documentElement.setAttribute("data-theme", t);
    out(`Theme set to ${t}.`, "muted");
  },
  bg(args) {
    const v = (args[0] || "").toLowerCase();
    if (v !== "on" && v !== "off") return out("Usage: bg <on|off>", "muted");
    setBg(v === "on");
    out(`Background ${v}.`, "muted");
  },
  clear() { screen.innerHTML = ""; },
  whoami() { out(DATA.name); },
  sudo() { out("Nice try. Permission denied.", "muted"); }
};

function run(raw) {
  const line = raw.trim();
  if (!line) return;
  out("$ " + line, "cmd");
  const [cmd, ...args] = line.split(/\s+/);
  const fn = commands[cmd.toLowerCase()];
  if (fn) fn(args); else out(`command not found: ${cmd}. Type help.`, "muted");
  blank();
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const v = input.value;
    if (v.trim()) history.push(v);
    histIdx = history.length;
    run(v);
    input.value = "";
  } else if (e.key === "ArrowUp") {
    if (histIdx > 0) { histIdx--; input.value = history[histIdx]; }
    e.preventDefault();
  } else if (e.key === "ArrowDown") {
    if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx]; }
    else { histIdx = history.length; input.value = ""; }
    e.preventDefault();
  } else if (e.key === "Tab") {
    e.preventDefault();
    const names = Object.keys(commands);
    const m = names.filter(n => n.startsWith(input.value.trim().toLowerCase()));
    if (m.length === 1) input.value = m[0] + " ";
  }
});

// Nav buttons and theme buttons run commands
document.querySelectorAll("[data-cmd]").forEach(b =>
  b.addEventListener("click", () => { run(b.dataset.cmd); input.focus(); }));
document.querySelectorAll("[data-theme-name]").forEach(b =>
  b.addEventListener("click", () => { run("theme " + b.dataset.themeName); }));

// ---------- BACKGROUND STARS ----------
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");
let stars = [];
function resize() {
  canvas.width = innerWidth; canvas.height = innerHeight;
  stars = Array.from({ length: 140 }, () => ({
    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
    r: Math.random() * 1.4 + 0.2, s: Math.random() * 0.25 + 0.05 }));
}
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent") || "#fff";
  stars.forEach(s => {
    s.y += s.s; if (s.y > canvas.height) s.y = 0;
    ctx.globalAlpha = 0.25 + s.r / 2;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  });
  requestAnimationFrame(draw);
}
const bgBtn = document.getElementById("bgToggle");
function setBg(on) {
  document.body.classList.toggle("nobg", !on);
  bgBtn.textContent = "BG: " + (on ? "On" : "Off");
}
bgBtn.addEventListener("click", () => {
  const on = document.body.classList.contains("nobg");
  setBg(on);
});
addEventListener("resize", resize);
resize(); draw();

welcome();
input.focus();
</script>
</body>
</html>
